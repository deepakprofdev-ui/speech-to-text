<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline STT</title>

    <style>
        body {
            background: #0e0e0e;
            color: #fff;
            font-family: Arial;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .wrap {
            background: #1b1b1b;
            width: 420px;
            padding: 25px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.7);
        }

        input,
        button {
            width: 100%;
            padding: 12px;
            margin-top: 12px;
            border-radius: 6px;
            font-size: 15px;
        }

        button {
            background: #0f9d58;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background: #0c7a45;
        }

        #status {
            margin: 10px 0;
            color: #ffd369;
            font-size: 14px;
        }

        #output {
            background: #000;
            padding: 12px;
            border-radius: 6px;
            margin-top: 15px;
            height: 150px;
            overflow: auto;
            white-space: pre-wrap;
            text-align: left;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <div class="wrap">
        <h2>🎤 Offline Speech to Text</h2>
        <input type="file" id="fileInput" accept="audio/*">
        <button id="transcribeBtn">Transcribe</button>
        <div id="status">Waiting for audio...</div>
        <div id="output">Your text will appear here...</div>
    </div>

    <script>
        const fileInput = document.getElementById("fileInput");
        const btn = document.getElementById("transcribeBtn");
        const statusBox = document.getElementById("status");
        const outputBox = document.getElementById("output");

        btn.onclick = async () => {
            const file = fileInput.files[0];
            if (!file) {
                statusBox.textContent = "❌ No audio selected.";
                return;
            }

            btn.disabled = true;
            statusBox.textContent = "⏳ Processing... Please wait.";
            outputBox.textContent = "Transcribing offline...";

            const formData = new FormData();
            formData.append("audio", file);

            try {
                const res = await fetch("https://YOUR-SERVICE-NAME.onrender.com/transcribe", {
                    method: "POST",
                    body: formData
                });
                const text = await res.text();
                outputBox.textContent = text;
                statusBox.textContent = "✅ Completed!";
            }
            catch (err) {
                outputBox.textContent = "Error: " + err;
                statusBox.textContent = "❌ Failed";
            }

            btn.disabled = false;
        };
    </script>
</body>

</html>
